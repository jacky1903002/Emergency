<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>緊急事故巡廠紀錄系統</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: {
              50: '#FAF8F5',
              100: '#F5F0EB',
              200: '#E6DCD3',
              300: '#D7C8BB',
              800: '#4A3E3D',
              900: '#2C2221',
            },
            amber: {
              700: '#B45309',
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SortableJS for Drag and Drop -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SheetJS for Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- html2canvas for PNG Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body {
      background-color: #FAF8F5;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .drag-handle {
      cursor: grab;
    }
    .drag-handle:active {
      cursor: grabbing;
    }
    .sortable-ghost {
      opacity: 0.4;
      background-color: #E6DCD3 !important;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #D7C8BB;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- 認證介面 (Auth Modal) -->
  <div id="authModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-cream-200 max-w-md w-full p-8 relative">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-amber-100 text-amber-700 mb-3 text-2xl">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">緊急事故巡廠系統</h2>
        <p class="text-sm text-gray-500 mt-1">請登入或註冊您的企業帳號</p>
      </div>

      <!-- Auth Tabs -->
      <div class="flex border-b border-gray-200 mb-6">
        <button id="tabLoginBtn" class="flex-1 pb-3 text-center font-bold text-amber-700 border-b-2 border-amber-700" onclick="switchAuthTab('login')">帳號登入</button>
        <button id="tabRegisterBtn" class="flex-1 pb-3 text-center font-bold text-gray-400 hover:text-gray-600" onclick="switchAuthTab('register')">註冊新帳號</button>
      </div>

      <!-- Error Message -->
      <div id="authError" class="hidden mb-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm flex items-start gap-2">
        <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
        <span id="authErrorText"></span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">電子郵件 Email</label>
          <input type="email" id="loginEmail" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-amber-500 focus:outline-none text-gray-900" placeholder="user@company.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">密碼 Password</label>
          <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-amber-500 focus:outline-none text-gray-900" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold py-3 rounded-lg shadow-md transition duration-200">
          立即登入 <i class="fa-solid fa-arrow-right-to-bracket ml-1"></i>
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">真實姓名 <span class="text-red-500">*</span></label>
          <input type="text" id="regName" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-amber-500 focus:outline-none text-gray-900" placeholder="例如：劉金勳">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">電子郵件 Email <span class="text-red-500">*</span></label>
          <input type="email" id="regEmail" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-amber-500 focus:outline-none text-gray-900" placeholder="user@company.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">設定密碼 Password <span class="text-red-500">*</span></label>
          <input type="password" id="regPassword" required minlength="6" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-amber-500 focus:outline-none text-gray-900" placeholder="至少6個字元">
        </div>
        <button type="submit" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold py-3 rounded-lg shadow-md transition duration-200">
          建立帳號並登入 <i class="fa-solid fa-user-plus ml-1"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- 主介面 Header -->
  <header class="bg-white border-b border-cream-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Logo + 標題 -->
      <div class="flex items-center space-x-4">
        <!-- 可連結或自訂圖片區域 -->
        <div class="relative group">
          <div id="logoContainer" class="w-12 h-12 rounded-xl bg-cream-100 border border-cream-300 flex items-center justify-center overflow-hidden shadow-inner cursor-pointer" onclick="triggerLogoUpload()" title="點擊更換企業Logo">
            <img id="customLogo" src="" alt="Company Logo" class="hidden w-full h-full object-cover">
            <i id="defaultLogoIcon" class="fa-solid fa-building-triangle-exclamation text-amber-700 text-2xl"></i>
          </div>
          <input type="file" id="logoFileInput" accept="image/*" class="hidden" onchange="uploadLogo(event)">
        </div>

        <div>
          <h1 class="text-2xl font-black tracking-tight text-gray-900 flex items-center gap-2">
            緊急事故巡廠紀錄系統
            <span class="text-xs px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 font-semibold border border-amber-300">企業專業版</span>
          </h1>
          <p class="text-xs text-gray-500">即時雲端備份與巡查追蹤管理平台</p>
        </div>
      </div>

      <!-- 右側 使用者狀態 & 雲端同步資訊 -->
      <div class="flex items-center space-x-6">
        <!-- 狀態監控 -->
        <div class="hidden md:flex flex-col text-right text-xs text-gray-600 border-r border-cream-200 pr-6">
          <div class="flex items-center justify-end gap-1.5 font-medium mb-1">
            <span id="connectionDot" class="w-2.5 h-2.5 rounded-full bg-gray-400"></span>
            <span id="connectionStatus">連線檢測中...</span>
          </div>
          <div class="text-gray-400">
            <i class="fa-regular fa-clock mr-1"></i>上次同步: <span id="lastSavedTime" class="font-mono text-gray-700">尚未同步</span>
          </div>
        </div>

        <!-- 人員登入資訊 -->
        <div id="userInfoArea" class="hidden flex items-center space-x-3">
          <div class="text-right">
            <div id="userNameDisplay" class="font-bold text-gray-900 text-sm">--</div>
            <div id="userEmailDisplay" class="text-xs text-gray-500">--</div>
          </div>
          <button onclick="handleLogout()" class="p-2 rounded-lg bg-cream-100 hover:bg-cream-200 text-gray-700 transition" title="登出系統">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    
    <!-- 分頁選單與控制功能面板 -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
      
      <!-- 頁籤按鈕 -->
      <div class="flex bg-cream-100 p-1.5 rounded-xl border border-cream-200 w-fit">
        <button id="viewTableBtn" onclick="switchMainView('table')" class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm transition bg-white text-gray-900 shadow-sm">
          <i class="fa-solid fa-list-check text-amber-700"></i> 巡廠紀錄表
        </button>
        <button id="viewChartBtn" onclick="switchMainView('chart')" class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm transition text-gray-600 hover:text-gray-900">
          <i class="fa-solid fa-chart-pie text-amber-700"></i> 統計分析圖表
        </button>
      </div>

      <!-- 功能操作按鈕群 -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="exportToExcel()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2.5 rounded-xl shadow-sm text-sm flex items-center gap-2 transition">
          <i class="fa-solid fa-file-excel"></i> 一鍵匯出 Excel
        </button>
        <label class="bg-teal-700 hover:bg-teal-800 text-white font-bold px-4 py-2.5 rounded-xl shadow-sm text-sm flex items-center gap-2 transition cursor-pointer">
          <i class="fa-solid fa-file-import"></i> 匯入 Excel
          <input type="file" accept=".xlsx, .xls" onchange="importExcel(event)" class="hidden">
        </label>
        <button onclick="exportToPNG()" class="bg-indigo-700 hover:bg-indigo-800 text-white font-bold px-4 py-2.5 rounded-xl shadow-sm text-sm flex items-center gap-2 transition">
          <i class="fa-solid fa-image"></i> 匯出 PNG
        </button>
      </div>
    </div>

    <!-- 視圖 1: 巡廠紀錄表區塊 -->
    <div id="tableViewSection" class="space-y-4">
      <div id="exportableArea" class="bg-white rounded-2xl shadow-sm border border-cream-200 overflow-hidden p-1">
        <div class="overflow-x-auto custom-scrollbar">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-cream-100 text-gray-900 text-sm font-black border-b border-cream-200 uppercase tracking-wider">
                <th class="py-4 px-3 text-center w-12">排序</th>
                <th class="py-4 px-4 w-28">編號</th>
                <th class="py-4 px-4 w-36">巡廠人員</th>
                <th class="py-4 px-4 w-52">巡廠日期時間</th>
                <th class="py-4 px-4 w-36">事由</th>
                <th class="py-4 px-4">備註 (異常回報)</th>
                <th class="py-4 px-4 w-48 text-center">巡檢簽名</th>
                <th class="py-4 px-4 w-20 text-center no-export">操作</th>
              </tr>
            </thead>
            <tbody id="recordsTableBody" class="divide-y divide-cream-100 text-sm text-gray-900 font-medium">
              <!-- 動態渲染資料列 -->
            </tbody>
          </table>
        </div>
        <div id="emptyState" class="hidden py-16 text-center text-gray-400">
          <i class="fa-solid fa-clipboard-list text-5xl mb-3 text-cream-300"></i>
          <p class="text-base font-semibold">目前尚無巡廠紀錄</p>
          <p class="text-xs text-gray-400 mt-1">請透過 Excel 匯入或聯絡管理員建立初始資料列</p>
        </div>
      </div>
    </div>

    <!-- 視圖 2: 統計分析圖表區塊 -->
    <div id="chartViewSection" class="hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- KPI Cards -->
        <div class="bg-white p-6 rounded-2xl border border-cream-200 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-gray-400">總巡檢次數</p>
            <h3 id="statTotal" class="text-3xl font-black text-gray-900 mt-1">0</h3>
          </div>
          <div class="w-12 h-12 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center text-xl">
            <i class="fa-solid fa-clipboard-check"></i>
          </div>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-cream-200 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-gray-400">最常見事故原因</p>
            <h3 id="statTopReason" class="text-2xl font-black text-amber-700 mt-1">無</h3>
          </div>
          <div class="w-12 h-12 rounded-xl bg-red-100 text-red-700 flex items-center justify-center text-xl">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-cream-200 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-gray-400">簽名完成率</p>
            <h3 id="statSignRate" class="text-3xl font-black text-emerald-700 mt-1">0%</h3>
          </div>
          <div class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-xl">
            <i class="fa-solid fa-signature"></i>
          </div>
        </div>
      </div>

      <!-- Charts Grid -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded-2xl border border-cream-200 shadow-sm">
          <h4 class="text-base font-bold text-gray-900 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-amber-700"></i> 事故事由分類統計
          </h4>
          <div class="relative h-64">
            <canvas id="reasonChart"></canvas>
          </div>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-cream-200 shadow-sm">
          <h4 class="text-base font-bold text-gray-900 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-chart-column text-amber-700"></i> 巡網人員巡查次數統計
          </h4>
          <div class="relative h-64">
            <canvas id="personChart"></canvas>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-cream-200 py-4 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500">
      &copy; 2026 緊急事故巡廠紀錄系統 Enterprise Platform. All rights reserved.
    </div>
  </footer>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut, 
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      onValue, 
      remove, 
      push, 
      serverTimestamp, 
      update
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAFnPk1KQfCqx5qfU9GOgK5F3McxHRajS4",
      authDomain: "emergency-3fc51.firebaseapp.com",
      projectId: "emergency-3fc51",
      storageBucket: "emergency-3fc51.firebasestorage.app",
      messagingSenderId: "399936603939",
      appId: "1:399936603939:web:77ee360adba9a719c2ae96",
      measurementId: "G-PGC27JWQT5"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Global App States
    window.currentUser = null;
    window.recordsData = [];
    window.sortableInstance = null;
    window.reasonChartObj = null;
    window.personChartObj = null;

    // Specified Inspectors List
    const INSPECTORS = [
      "蔡儀誠","鄭玄曄","梁寶文","陳建華","陳秉鉞","彭顏偉",
      "楊志偉","林辰翰","蔡旻哲","王盈憲","黃志浩","李律賢",
      "戴群津","秦若庭","劉盈春","劉金勳","彭俊銘","簡志洋",
      "張益盛","王書彬","王振洲","呂文頡","陳志銘","徐柏欽"
    ];

    const REASON_OPTIONS = ["天災", "人禍", "地震", "颱風", "其他"];

    // Monitor Connection Status
    const connectedRef = ref(db, ".info/connected");
    onValue(connectedRef, (snap) => {
      const dot = document.getElementById('connectionDot');
      const statusText = document.getElementById('connectionStatus');
      if (snap.val() === true) {
        dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
        statusText.textContent = "雲端即時連線中";
        statusText.className = "text-emerald-700 font-bold";
      } else {
        dot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
        statusText.textContent = "連線中斷";
        statusText.className = "text-red-600 font-bold";
      }
    });

    // Auth State Observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.currentUser = user;
        document.getElementById('authModal').classList.add('hidden');
        document.getElementById('userInfoArea').classList.remove('hidden');
        
        document.getElementById('userNameDisplay').textContent = user.displayName || user.email.split('@')[0];
        document.getElementById('userEmailDisplay').textContent = user.email;

        // Load Database Listeners
        initDatabaseListener();
      } else {
        window.currentUser = null;
        document.getElementById('authModal').classList.remove('hidden');
        document.getElementById('userInfoArea').classList.add('hidden');
      }
    });

    // Auth Tab Switch
    window.switchAuthTab = (tab) => {
      const loginForm = document.getElementById('loginForm');
      const regForm = document.getElementById('registerForm');
      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegBtn = document.getElementById('tabRegisterBtn');
      document.getElementById('authError').classList.add('hidden');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        tabLoginBtn.className = "flex-1 pb-3 text-center font-bold text-amber-700 border-b-2 border-amber-700";
        tabRegBtn.className = "flex-1 pb-3 text-center font-bold text-gray-400 hover:text-gray-600";
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        tabRegBtn.className = "flex-1 pb-3 text-center font-bold text-amber-700 border-b-2 border-amber-700";
        tabLoginBtn.className = "flex-1 pb-3 text-center font-bold text-gray-400 hover:text-gray-600";
      }
    };

    // User Register
    window.handleRegister = async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pwd = document.getElementById('regPassword').value;
      const errBox = document.getElementById('authError');

      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, pwd);
        await updateProfile(userCred.user, { displayName: name });
        window.location.reload();
      } catch (err) {
        errBox.classList.remove('hidden');
        document.getElementById('authErrorText').textContent = `註冊失敗 (${err.code}): ${err.message}`;
      }
    };

    // User Login (Enhanced with detailed error output)
    window.handleLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pwd = document.getElementById('loginPassword').value;
      const errBox = document.getElementById('authError');

      try {
        await signInWithEmailAndPassword(auth, email, pwd);
      } catch (err) {
        errBox.classList.remove('hidden');
        document.getElementById('authErrorText').textContent = `登入失敗 (${err.code})：請確認 Firebase 是否已啟用 Email 登入或帳密是否正確。`;
      }
    };

    // User Logout
    window.handleLogout = () => {
      if (confirm('確定要登出系統嗎？')) {
        signOut(auth);
      }
    };

    // Database Realtime Listener
    function initDatabaseListener() {
      const recordsRef = ref(db, 'patrol_records');
      onValue(recordsRef, (snapshot) => {
        const data = snapshot.val();
        window.recordsData = [];
        if (data) {
          Object.keys(data).forEach(key => {
            window.recordsData.push({ id: key, ...data[key] });
          });
          // Sort by Order
          window.recordsData.sort((a, b) => (a.order || 0) - (b.order || 0));
        }

        renderTable();
        renderCharts();
        
        // Update Last Saved Time
        const now = new Date();
        document.getElementById('lastSavedTime').textContent = now.toLocaleString('zh-TW', { hour12: false });
      });
    }

    // Helper: Convert YYMMDD HH:mm to ISO Datetime Local string (YYYY-MM-THH:mm)
    function parseFormattedDTToPicker(dtStr) {
      if (!dtStr || dtStr.length < 11) return '';
      try {
        const year = '20' + dtStr.substring(0, 2);
        const month = dtStr.substring(2, 4);
        const day = dtStr.substring(4, 6);
        const time = dtStr.substring(7, 12);
        return `${year}-${month}-${day}T${time}`;
      } catch (e) {
        return '';
      }
    }

    // Helper: Convert Date object or ISO string to YYMMDD HH:mm
    function formatPickerToYYMMDD(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '';
      const yy = String(d.getFullYear()).slice(-2);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${yy}${mm}${dd} ${hh}:${min}`;
    }

    // Render Table Body with In-line Editable Controls
    function renderTable() {
      const tbody = document.getElementById('recordsTableBody');
      const emptyState = document.getElementById('emptyState');
      
      const activeElId = document.activeElement ? document.activeElement.id : null;
      
      tbody.innerHTML = '';

      if (window.recordsData.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      window.recordsData.forEach((item, idx) => {
        const tr = document.createElement('tr');
        tr.dataset.id = item.id;
        tr.className = "hover:bg-cream-50 transition border-b border-cream-100";

        // Formatted Signature Display
        let signatureHtml = '';
        if (item.signature) {
          signatureHtml = `
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-bold">
              <i class="fa-solid fa-check"></i>
              <span>${escapeHtml(item.signature)}</span>
            </div>
          `;
        } else {
          signatureHtml = `
            <button onclick="signRecord('${item.id}')" class="px-3 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 text-xs font-bold flex items-center justify-center gap-1.5 mx-auto transition shadow-sm">
              <i class="fa-solid fa-signature text-amber-700"></i>
              <span>點擊簽名</span>
            </button>
          `;
        }

        // Reason Options HTML
        const reasonSelectHtml = REASON_OPTIONS.map(opt => `
          <option value="${opt}" ${item.reason === opt ? 'selected' : ''}>${opt}</option>
        `).join('');

        const pickerValue = parseFormattedDTToPicker(item.dateTime);

        tr.innerHTML = `
          <td class="py-3.5 px-3 text-center drag-handle text-gray-400 hover:text-amber-700">
            <i class="fa-solid fa-grip-vertical"></i>
          </td>
          <td class="py-3.5 px-4 font-mono font-bold text-gray-900">${escapeHtml(item.code || '')}</td>
          <td class="py-3.5 px-4 text-gray-900 font-bold select-none">${escapeHtml(item.inspector || '')}</td>
          <td class="py-2 px-3">
            <input type="datetime-local" 
                   id="dt_${item.id}"
                   value="${pickerValue}" 
                   onchange="updateRecordField('${item.id}', 'dateTime', this.value)"
                   class="w-full px-2 py-1.5 text-xs font-mono rounded border border-gray-300 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
          </td>
          <td class="py-2 px-3">
            <select onchange="updateRecordField('${item.id}', 'reason', this.value)"
                    class="w-full px-2 py-1.5 text-xs font-bold rounded border border-gray-300 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
              ${reasonSelectHtml}
            </select>
          </td>
          <td class="py-2 px-3">
            <input type="text" 
                   id="note_${item.id}"
                   value="${escapeHtml(item.note || '')}" 
                   placeholder="直接在此輸入備註..."
                   onblur="updateRecordField('${item.id}', 'note', this.value)"
                   onkeydown="if(event.key==='Enter') this.blur()"
                   class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
          </td>
          <td class="py-3.5 px-4 text-center">${signatureHtml}</td>
          <td class="py-3.5 px-4 text-center no-export">
            <button onclick="deleteRecord('${item.id}')" class="p-1.5 rounded-md text-gray-400 hover:text-red-700 hover:bg-red-50 transition" title="刪除">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      if (activeElId) {
        const el = document.getElementById(activeElId);
        if (el) el.focus();
      }

      if (!window.sortableInstance) {
        window.sortableInstance = new Sortable(tbody, {
          handle: '.drag-handle',
          animation: 150,
          ghostClass: 'sortable-ghost',
          onEnd: function () {
            saveNewOrder();
          }
        });
      }
    }

    // In-line Field Updating
    window.updateRecordField = (id, field, value) => {
      let valToSave = value;
      if (field === 'dateTime') {
        valToSave = formatPickerToYYMMDD(value);
      }
      update(ref(db, `patrol_records/${id}`), {
        [field]: valToSave
      });
    };

    // Save Drag and Drop Order
    function saveNewOrder() {
      const rows = document.querySelectorAll('#recordsTableBody tr');
      rows.forEach((row, idx) => {
        const id = row.dataset.id;
        if (id) {
          update(ref(db, `patrol_records/${id}`), { order: idx });
        }
      });
    }

    // Direct Signature Action
    window.signRecord = (id) => {
      if (!window.currentUser) return;
      const signerName = window.currentUser.displayName || window.currentUser.email.split('@')[0];
      const timeStr = new Date().toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
      const signString = `${signerName} (${timeStr})`;

      update(ref(db, `patrol_records/${id}`), { signature: signString });
    };

    // Delete Record
    window.deleteRecord = (id) => {
      if (confirm('確定要刪除這筆巡廠紀錄嗎？此動作無法復原。')) {
        remove(ref(db, `patrol_records/${id}`));
      }
    };

    // View Switching
    window.switchMainView = (view) => {
      const tableView = document.getElementById('tableViewSection');
      const chartView = document.getElementById('chartViewSection');
      const viewTableBtn = document.getElementById('viewTableBtn');
      const viewChartBtn = document.getElementById('viewChartBtn');

      if (view === 'table') {
        tableView.classList.remove('hidden');
        chartView.classList.add('hidden');
        viewTableBtn.className = "flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm transition bg-white text-gray-900 shadow-sm";
        viewChartBtn.className = "flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm transition text-gray-600 hover:text-gray-900";
      } else {
        tableView.classList.add('hidden');
        chartView.classList.remove('hidden');
        viewChartBtn.className = "flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm transition bg-white text-gray-900 shadow-sm";
        viewTableBtn.className = "flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm transition text-gray-600 hover:text-gray-900";
        renderCharts();
      }
    };

    // Analytics Chart.js Rendering
    function renderCharts() {
      const data = window.recordsData;

      document.getElementById('statTotal').textContent = data.length;
      
      const signedCount = data.filter(d => d.signature && d.signature.trim() !== '').length;
      const rate = data.length > 0 ? Math.round((signedCount / data.length) * 100) : 0;
      document.getElementById('statSignRate').textContent = `${rate}%`;

      const reasonMap = {};
      data.forEach(d => {
        const r = d.reason || '其他';
        reasonMap[r] = (reasonMap[r] || 0) + 1;
      });

      let topReason = '無';
      let maxCount = 0;
      Object.entries(reasonMap).forEach(([k, v]) => {
        if (v > maxCount) {
          maxCount = v;
          topReason = k;
        }
      });
      document.getElementById('statTopReason').textContent = topReason;

      const reasonCtx = document.getElementById('reasonChart').getContext('2d');
      if (window.reasonChartObj) window.reasonChartObj.destroy();

      window.reasonChartObj = new Chart(reasonCtx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(reasonMap),
          datasets: [{
            data: Object.values(reasonMap),
            backgroundColor: ['#2563EB', '#DC2626', '#D97706', '#0D9488', '#6B7280']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });

      const personMap = {};
      data.forEach(d => {
        const p = d.inspector || '未指定';
        personMap[p] = (personMap[p] || 0) + 1;
      });

      const personCtx = document.getElementById('personChart').getContext('2d');
      if (window.personChartObj) window.personChartObj.destroy();

      window.personChartObj = new Chart(personCtx, {
        type: 'bar',
        data: {
          labels: Object.keys(personMap),
          datasets: [{
            label: '巡查次數',
            data: Object.values(personMap),
            backgroundColor: '#B45309'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: { beginAtZero: true, ticks: { stepSize: 1 } }
          }
        }
      });
    }

    // Export Excel
    window.exportToExcel = () => {
      if (window.recordsData.length === 0) {
        alert('無紀錄可匯出');
        return;
      }

      const excelRows = window.recordsData.map((item, index) => ({
        "順序": index + 1,
        "編號": item.code || '',
        "巡廠人員": item.inspector || '',
        "巡廠日期時間": item.dateTime || '',
        "事由": item.reason || '',
        "備註 (異常回報)": item.note || '',
        "巡檢簽名": item.signature || '未簽名'
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "緊急事故巡廠紀錄");
      XLSX.writeFile(workbook, `巡廠紀錄表_${new Date().toISOString().slice(0,10)}.xlsx`);
    };

    // Import Excel
    window.importExcel = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.SheetNames[0];
          const json = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);

          if (json.length > 0 && confirm(`準備匯入 ${json.length} 筆資料，將會追加至雲端，是否繼續？`)) {
            json.forEach((row, idx) => {
              const newRef = push(ref(db, 'patrol_records'));
              set(newRef, {
                code: row["編號"] || `PR-IMP-${idx+1}`,
                inspector: row["巡廠人員"] || INSPECTORS[0],
                dateTime: row["巡廠日期時間"] || '',
                reason: row["事由"] || '其他',
                note: row["備註 (異常回報)"] || '',
                signature: row["巡檢簽名"] === '未簽名' ? '' : (row["巡檢簽名"] || ''),
                order: window.recordsData.length + idx,
                createdAt: serverTimestamp()
              });
            });
            alert('匯入成功！');
          }
        } catch (err) {
          alert('解析 Excel 檔案失敗，請確保欄位名稱正確。');
        }
      };
      reader.readAsArrayBuffer(file);
    };

    // Export PNG
    window.exportToPNG = () => {
      const target = document.getElementById('exportableArea');
      html2canvas(target, {
        scale: 2,
        ignoreElements: (el) => el.classList.contains('no-export')
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `巡廠紀錄畫面_${new Date().toISOString().slice(0,10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    };

    // Custom Logo Trigger & Local Storage
    window.triggerLogoUpload = () => {
      document.getElementById('logoFileInput').click();
    };

    window.uploadLogo = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const logoData = evt.target.result;
        localStorage.setItem('custom_patrol_logo', logoData);
        applyLogo(logoData);
      };
      reader.readAsDataURL(file);
    };

    function applyLogo(src) {
      const customImg = document.getElementById('customLogo');
      const defaultIcon = document.getElementById('defaultLogoIcon');
      if (src) {
        customImg.src = src;
        customImg.classList.remove('hidden');
        defaultIcon.classList.add('hidden');
      }
    }

    const savedLogo = localStorage.getItem('custom_patrol_logo');
    if (savedLogo) {
      applyLogo(savedLogo);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
